[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info
    Parsers_File D:/research/ResearchMesh/config/amp/parsers-amp.conf

[INPUT]
    Name              tail
    Path              D:/research/ResearchMesh/logs/amp_heartbeat_reader_live.jsonl
    Tag               amp.heartbeat
    Parser            amp_audit_json
    Refresh_Interval  1
    Read_From_Head    False
    DB                D:/research/ResearchMesh/logs/fluentbit-heartbeat-reader-platform.db
    Skip_Long_Lines   On

[OUTPUT]
    Name                              kafka
    Match                             amp.heartbeat
    Brokers                           wt.ioa.pub:19092
    Topics                            amp.heartbeat
    Workers                           1
    Format                            json
    rdkafka.log.connection.close      false
    rdkafka.request.required.acks     1
    rdkafka.allow.auto.create.topics  false
